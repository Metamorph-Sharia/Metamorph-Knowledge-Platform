AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The curation web app on Fargate (docs/aws-deployment-guide.md), served by CloudFront at the app's host name with
  an ACM certificate from us-east-1 (CloudFront's region; the account may not issue certificates in Jakarta). Its
  load balancer is internal, in private subnets, and CloudFront reaches it through a VPC origin over AWS's network:
  nothing of the app is on the internet but CloudFront. Stop it with DesiredCount=0; CloudFront then answers 503.

Parameters:
  WebTag: {Type: String, Description: The metamorph/curation-web image's tag (deploy/aws/push-images.sh)}
  DomainName: {Type: String, Description: "The app's host name, e.g. curation.example.com"}
  CertificateArn: {Type: String, Description: "The ACM certificate for that name, issued in us-east-1"}
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: metamorph-web
      Type: application
      Scheme: internal
      Subnets: !Split [",", !ImportValue metamorph-private-subnets]
      SecurityGroups: [!ImportValue metamorph-sg-load-balancer]
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId: !ImportValue metamorph-vpc
      HealthCheckPath: /sign-in
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Target}]

  # CloudFront → the internal load balancer, over AWS's network (HTTP inside the VPC; HTTPS to the browser).
  Origin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: metamorph-web
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: metamorph curation web app
        Aliases: [!Ref DomainName]
        ViewerCertificate: {AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        HttpVersion: http2and3
        PriceClass: PriceClass_200          # includes Asia
        Origins:
          - Id: web
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig: {VpcOriginId: !GetAtt Origin.Id, OriginReadTimeout: 60}
        # Pages are signed in and change with every curation: nothing is cached, and the browser's cookies,
        # headers and query strings reach the app as they were sent. Next.js's hashed assets are cached.
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized

  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/curation-web:${WebTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          PortMappings: [{ContainerPort: 3000}]
          Secrets: [{Name: METAMORPH_API_URL, ValueFrom: /metamorph/web/api-url}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-web}

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: web
      Cluster: !ImportValue metamorph-cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      LoadBalancers: [{ContainerName: main, ContainerPort: 3000, TargetGroupArn: !Ref Target}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:   # the load balancer's zones (the first two, sorted by zone): it sends no traffic to another
            - !Select [0, !Split [",", !ImportValue metamorph-subnets]]
            - !Select [1, !Split [",", !ImportValue metamorph-subnets]]
          SecurityGroups: [!ImportValue metamorph-sg-web]
          AssignPublicIp: ENABLED   # no NAT gateway: ECR and Parameter Store over the internet; nothing comes in

Outputs:
  DistributionDomain:
    Description: Point the app's host name here (a CNAME)
    Value: !GetAtt Distribution.DomainName
