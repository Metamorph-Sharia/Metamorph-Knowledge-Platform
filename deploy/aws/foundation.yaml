AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Metamorph on ECS, the core's foundation (docs/aws-deployment-guide.md): the cluster, the security groups, the blob
  and operations buckets, the core's image repositories, and the wiring every service reads from Parameter Store. It
  creates no IAM role: the tasks run with roles that already exist, passed in below, and reach S3 through the
  buckets' own policies. The services are stacks of their own, and ingestion plugs in later as another layer
  (deploy/aws/ingestion), using only this stack's exports.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The default VPC's three subnets, one per Availability Zone (public; there is no NAT gateway)
  ExecutionRoleArn:
    Type: String
    Description: The role ECS uses to start every task (pull the image, write its log, read its settings)
  AppRoleArn:
    Type: String
    Description: The role the API's containers run as. A dedicated role can replace the execution role later
  BucketRoleArns:
    Type: CommaDelimitedList
    Description: >-
      Every role that may use the blobs bucket (read and write) and read the operations bucket's transfer/ through
      the buckets' policies: the app role. Roles with S3 permissions of their own (the ingestion layer's) need no entry
  AppOrigin:
    Type: String
    Default: ""
    Description: https://<the curation app's host name>. Browsers there may upload files into the blobs bucket

Conditions:
  HasAppOrigin: !Not [!Equals [!Ref AppOrigin, ""]]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: metamorph
      ClusterSettings: [{Name: containerInsights, Value: disabled}]

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /metamorph
      RetentionInDays: 30

  # Security groups: who may reach whom. Only the public load balancer takes traffic from the internet.
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: metamorph public load balancer, HTTPS from anywhere
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  WebGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: metamorph curation web app, VpcId: !Ref VpcId}
  ApiGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: metamorph curation API and its migrations, VpcId: !Ref VpcId}
  DatabaseGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: metamorph PostgreSQL, VpcId: !Ref VpcId}
  DatabaseOpsGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: metamorph database operations (restores), VpcId: !Ref VpcId}
  WebFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref WebGroup, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref LoadBalancerGroup}
  DatabaseFromApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiGroup}
  DatabaseFromOps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref DatabaseOpsGroup}

  Blobs:   # the platform's text and file blobs; the API signs links into it for browsers
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub metamorph-blobs-${AWS::AccountId}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      LifecycleConfiguration:
        Rules: [{Id: multipart, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 2}}]
      CorsConfiguration:   # as the platform's `storage init --upload-origin` sets it (adapters/blobs/s3.py)
        !If
          - HasAppOrigin
          - CorsRules: [{AllowedOrigins: [!Ref AppOrigin], AllowedMethods: [PUT], AllowedHeaders: [content-type], MaxAge: 3600}]
          - !Ref AWS::NoValue
  # The roles reach the bucket through its policy, not their own: no role has to be created or changed. The
  # platform never deletes a blob (adapters/blobs/s3.py), so nothing may.
  BlobsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Blobs
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref BucketRoleArns}
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !GetAtt Blobs.Arn
          - Effect: Allow
            Principal: {AWS: !Ref BucketRoleArns}
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub "${Blobs.Arn}/*"
  Ops:     # what an operator hands to AWS: database dumps, source archives, the data moved from the Mac
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub metamorph-ops-${AWS::AccountId}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      LifecycleConfiguration:
        Rules:
          - {Id: transfer, Status: Enabled, Prefix: transfer/, ExpirationInDays: 14}
          - {Id: multipart, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 2}}
  OpsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Ops
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref BucketRoleArns}
            Action: s3:ListBucket
            Resource: !GetAtt Ops.Arn
          - Effect: Allow
            Principal: {AWS: !Ref BucketRoleArns}
            Action: s3:GetObject
            Resource: !Sub "${Ops.Arn}/transfer/*"

  # The core's images. Ingestion's own repositories come with it.
  PlatformImages:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: metamorph/platform, LifecyclePolicy: {LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'}}
  WebImages:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: metamorph/curation-web, LifecyclePolicy: {LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'}}

  # The wiring, in Parameter Store beside the settings an operator writes (the guide's Phase 2): every value a task
  # reads from its environment comes from /metamorph/.
  BucketSetting:
    Type: AWS::SSM::Parameter
    Properties: {Name: /metamorph/platform/s3-bucket, Type: String, Value: !Ref Blobs}
  OpsBucketSetting:
    Type: AWS::SSM::Parameter
    Properties: {Name: /metamorph/ops/bucket, Type: String, Value: !Ref Ops}

Outputs:
  VpcId: {Value: !Ref VpcId, Export: {Name: metamorph-vpc}}
  Subnets: {Value: !Join [",", !Ref Subnets], Export: {Name: metamorph-subnets}}
  Cluster: {Value: !Ref Cluster, Export: {Name: metamorph-cluster}}
  ClusterArn: {Value: !GetAtt Cluster.Arn, Export: {Name: metamorph-cluster-arn}}
  Logs: {Value: !Ref Logs, Export: {Name: metamorph-logs}}
  LoadBalancerGroup: {Value: !Ref LoadBalancerGroup, Export: {Name: metamorph-sg-load-balancer}}
  WebGroup: {Value: !Ref WebGroup, Export: {Name: metamorph-sg-web}}
  ApiGroup: {Value: !Ref ApiGroup, Export: {Name: metamorph-sg-api}}
  DatabaseGroup: {Value: !Ref DatabaseGroup, Export: {Name: metamorph-sg-database}}
  DatabaseOpsGroup: {Value: !Ref DatabaseOpsGroup, Export: {Name: metamorph-sg-database-ops}}
  Blobs: {Value: !Ref Blobs, Export: {Name: metamorph-blobs}}
  BlobsArn: {Value: !GetAtt Blobs.Arn, Export: {Name: metamorph-blobs-arn}}
  Ops: {Value: !Ref Ops, Export: {Name: metamorph-ops}}
  OpsArn: {Value: !GetAtt Ops.Arn, Export: {Name: metamorph-ops-arn}}
  Registry: {Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com", Export: {Name: metamorph-registry}}
  ExecutionRoleArn: {Value: !Ref ExecutionRoleArn, Export: {Name: metamorph-execution-role}}
  AppRoleArn: {Value: !Ref AppRoleArn, Export: {Name: metamorph-app-role}}
