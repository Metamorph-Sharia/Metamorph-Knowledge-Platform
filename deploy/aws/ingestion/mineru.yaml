AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MinerU on one ECS GPU instance (docs/aws-deployment-guide.md), for the collection host's connectors only. Fargate
  has no GPU, and the account allows no Auto Scaling and no Cloud Map, so the stack is one g5.xlarge EC2 instance in
  the cluster, started and stopped by EventBridge Scheduler around the collection host's weekday window, with the
  MinerU service on it behind an internal load balancer. The 20 GB image stays on the instance's disk while it is stopped. The collection host, off AWS, reaches
  that balancer through a CloudFront front door (a VPC origin, no caching); MinerU checks its own API key and
  ingestion/waf.sh mineru rate-limits the address. Creates no IAM: the instance's profile and the scheduler's role
  come from parameters. Every create carries Owner=project3.

Parameters:
  MinerUTag:
    Type: String
    Default: 4.0.12-r2
    Description: The metamorph/mineru image's tag, built by CodeBuild (README step 6). -r2 resolves its dependencies as of 2026-10-22
  InstanceType:
    Type: String
    Default: g5.xlarge
    AllowedValues: [g5.xlarge, g5.2xlarge]
    Description: g5.2xlarge (32 GiB) if a long scan exhausts g5.xlarge's 16 GiB
  GpuImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id
    Description: The ECS-optimized GPU AMI; its NVIDIA driver must be 580 or newer (MinerU's vLLM needs CUDA 13)
  VolumeGiB:
    Type: Number
    Default: 100
    MaxValue: 100
    Description: The account's limit on a volume. The image is 19.6 GB, and the models and caches need room beside it
  InstanceSubnetIndex:
    Type: Number
    # g5.xlarge is offered only in ap-southeast-3a and 3c. The core's metamorph-subnets lists its subnets in the
    # order 3b, 3c, 3a, so index 0 (3b) would fail at launch; 1 is 3c. Check the order again if the core changes.
    Default: 1
    MinValue: 0
    MaxValue: 2
    Description: Which of the default VPC's subnets (metamorph-subnets, in order) holds the instance. Only index 1 (3c) and 2 (3a) offer g5.xlarge; try the other if the zone has no capacity
  InstanceProfile:
    Type: String
    Default: metamorph-mineru-instance
    Description: The instance profile DevOps made (a role of the same name, trusted by ec2)
  SchedulerRole:
    Type: String
    Default: metamorph-scheduler
    Description: The role DevOps made for EventBridge Scheduler; it may start and stop only an instance named metamorph-mineru
  WindowStart:
    Type: String
    Default: cron(45 1 ? * MON-FRI *)
    Description: UTC, weekdays; 08:45 WIB. A quarter of an hour for boot and placement, then the models load before the first ingest at 02:00 (jobs.py)
  WindowEnd:
    Type: String
    Default: cron(45 5 4-31 * ? *)
    Description: UTC; 12:45 WIB. An hour after the last ingest that reads PDFs starts (ingest_ojk_register, Mondays 03:45), so its run is not cut. Not on the 1st to 3rd, which have their own end (a weekend's days stop it anyway)
  MonthlyWindowEnd:
    Type: String
    Default: cron(15 6 1-3 * ? *)
    Description: UTC; 13:15 WIB. The month's first weekday is always the 1st, 2nd or 3rd, and DSN-MUI's full pass runs then (03:30). A second weekday among them runs half an hour longer than it needs
  HourlyStop:
    Type: String
    Default: cron(0 0,1,7-23 * * ? *)
    Description: UTC. Stops the instance every hour on the hour outside the window, so one started by hand (README, The window) ends within the hour
  WebAclArn:
    Type: String
    Default: ""
    Description: The rate-limiting web ACL that `ingestion/waf.sh create mineru` makes in us-east-1 (CloudFront's region), or empty
  CloudFrontPrefixList:
    Type: String
    Default: pl-bca247d5
    Description: CloudFront's origin-facing addresses in this region, the only source besides the jobs the load balancer accepts

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref GpuImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:   # a public address reaches ECS, ECR and CloudWatch without a NAT gateway
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Select [!Ref InstanceSubnetIndex, !Split [",", !ImportValue metamorph-subnets]]
          GroupSet: [!ImportValue metamorph-sg-gpu-host]
      BlockDeviceMappings:
        - {DeviceName: /dev/xvda, Ebs: {VolumeSize: !Ref VolumeGiB, VolumeType: gp3, Encrypted: true}}
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2}
      Tags:   # Name is what the scheduler role's policy matches; Owner is what the account's SCP requires
        - {Key: Name, Value: metamorph-mineru}
        - {Key: Owner, Value: project3}
      # The image stays on disk between windows (no cleanup, cached before pulled), so only the first window pulls it.
      # The attribute is what the MinerU service's placement constraint requires.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            cat >> /etc/ecs/ecs.config <<EOF
            ECS_CLUSTER=${Cluster}
            ECS_ENABLE_GPU_SUPPORT=true
            ECS_INSTANCE_ATTRIBUTES={"workload": "mineru"}
            ECS_IMAGE_PULL_BEHAVIOR=prefer-cached
            ECS_DISABLE_IMAGE_CLEANUP=true
            EOF
          - Cluster: !ImportValue metamorph-cluster

  LoadBalancer:   # the front door's stable origin; the task behind it changes with every start
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: metamorph-mineru
      Type: application
      Scheme: internal
      # The private subnets, where a CloudFront VPC origin reaches a balancer (as for Airflow's). They share the zones of
      # the first two of metamorph-subnets (3b, 3c), so the instance must be in one of them: InstanceSubnetIndex 1 (3c).
      Subnets: !Split [",", !ImportValue metamorph-private-subnets]
      SecurityGroups: [!ImportValue metamorph-sg-mineru-lb]
      # MinerU's server (uvicorn) closes an idle connection after 5 s. The balancer must drop it first, or it now and then
      # sends a poll down a closed connection and answers 502 (seen 2026-11-23: two fatwas lost their OCR).
      LoadBalancerAttributes: [{Key: idle_timeout.timeout_seconds, Value: "4"}]
      Tags: [{Key: Owner, Value: project3}]
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip   # the task has its own interface (awsvpc)
      Protocol: HTTP
      Port: 8010
      VpcId: !ImportValue metamorph-vpc
      HealthCheckPath: /v1/health   # ok once the models are loaded (--preload-models)
      HealthCheckIntervalSeconds: 30
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
      Tags: [{Key: Owner, Value: project3}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 8010   # the port the load balancer's group admits from the jobs
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Target}]

  LoadBalancerFromCloudFront:   # the jobs' own rule, on the same group, is in shared.yaml
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue metamorph-sg-mineru-lb
      IpProtocol: tcp
      FromPort: 8010
      ToPort: 8010
      SourcePrefixListId: !Ref CloudFrontPrefixList

  # The front door, for the collection host's connectors: CloudFront (HTTPS, its own *.cloudfront.net name) -> VPC
  # origin -> the internal load balancer above. No password at the edge: MinerU checks the API key in the
  # Authorization header itself, and ingestion/waf.sh mineru limits what one address can try.
  Origin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: metamorph-mineru
        Arn: !Ref LoadBalancer
        HTTPPort: 8010
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
      Tags: [{Key: Owner, Value: project3}]
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: metamorph MinerU front door
        HttpVersion: http2and3
        PriceClass: PriceClass_200          # includes Asia
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: mineru
            DomainName: !GetAtt LoadBalancer.DNSName
            # Work is async (submit, then poll), so each request is short. The chain hangs up from the front: CloudFront
            # after 2 s idle, the load balancer after 4, MinerU's server after 5; otherwise a poll can get a 502.
            VpcOriginConfig: {VpcOriginId: !GetAtt Origin.Id, OriginReadTimeout: 60, OriginKeepaliveTimeout: 2}
        DefaultCacheBehavior:
          TargetOriginId: mineru
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader: Authorization reaches MinerU
      Tags: [{Key: Owner, Value: project3}]

  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-mineru
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      Volumes: [{Name: uploads}]       # the files MinerU was sent, on the instance; nothing worth keeping
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/mineru:${MinerUTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          MemoryReservation: 12288
          ResourceRequirements: [{Type: GPU, Value: "1"}]
          LinuxParameters: {SharedMemorySize: 2048}   # vLLM's workers share tensors through /dev/shm
          PortMappings: [{ContainerPort: 8010}]
          MountPoints: [{SourceVolume: uploads, ContainerPath: /uploads}]
          # The models are in the image: never ask the Hugging Face Hub.
          Environment: [{Name: HF_HUB_OFFLINE, Value: "1"}]
          Secrets: [{Name: MINERU_API_KEY, ValueFrom: /metamorph/mineru/api-key}]
          HealthCheck:   # healthy once the models are loaded (--preload-models)
            Command: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/health')"]
            Interval: 30
            Retries: 5
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-mineru}
      Tags: [{Key: Owner, Value: project3}]

  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, Instance]
    Properties:
      ServiceName: mineru
      Cluster: !ImportValue metamorph-cluster
      TaskDefinition: !Ref Task
      LaunchType: EC2
      DesiredCount: 1   # it places itself whenever the instance is running, and waits while it is stopped
      PlacementConstraints: [{Type: memberOf, Expression: "attribute:workload == mineru"}]
      HealthCheckGracePeriodSeconds: 900   # a start loads the models; the first one also pulls the image
      DeploymentConfiguration: {MinimumHealthyPercent: 0, MaximumPercent: 100}   # one GPU: replace, don't overlap
      LoadBalancers: [{ContainerName: main, ContainerPort: 8010, TargetGroupArn: !Ref Target}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split [",", !ImportValue metamorph-subnets]
          SecurityGroups: [!ImportValue metamorph-sg-mineru]
          AssignPublicIp: DISABLED     # an EC2 task's interface takes no public address
      Tags: [{Key: Owner, Value: project3}]

  Open:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: metamorph-mineru-open
      ScheduleExpression: !Ref WindowStart
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SchedulerRole}"
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'
  Close:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: metamorph-mineru-close
      ScheduleExpression: !Ref WindowEnd
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SchedulerRole}"
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'
  CloseHourly:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: metamorph-mineru-close-hourly
      ScheduleExpression: !Ref HourlyStop
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SchedulerRole}"
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'
  CloseMonthly:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: metamorph-mineru-close-monthly
      ScheduleExpression: !Ref MonthlyWindowEnd
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SchedulerRole}"
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

Outputs:
  InstanceId: {Value: !Ref Instance}
  FrontDoorUrl:
    Description: MinerU's address off AWS (the collection host's METAMORPH_MINERU_URL); its API key is METAMORPH_MINERU_API_KEY
    Value: !Sub "https://${Distribution.DomainName}"
