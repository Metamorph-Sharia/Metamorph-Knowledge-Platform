      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref ConnectorCpu
      Memory: !Ref ConnectorMemory
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ConnectorTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bps-stats-data}
        - Name: bundles
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bundles}
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/bps-stats:${BpsStatsTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          MountPoints:
            - {SourceVolume: data, ContainerPath: /workspace/BPS-Stats-Connector/data}
            - {SourceVolume: bundles, ContainerPath: /bundles}
          Secrets:   # jobs.py's CONNECTOR_SETTINGS: one parameter rolls every connector back at once
            - {Name: METAMORPH_PDF_LINES, ValueFrom: /metamorph/connectors/pdf-lines}
            - {Name: METAMORPH_PDF_ENGINE, ValueFrom: /metamorph/connectors/pdf-engine}
            - {Name: METAMORPH_MINERU_URL, ValueFrom: /metamorph/connectors/mineru-url}
            - {Name: METAMORPH_MINERU_API_KEY, ValueFrom: /metamorph/mineru/api-key}
            - {Name: METAMORPH_MINERU_CACHE, ValueFrom: /metamorph/connectors/mineru-cache}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-bps-stats}

  Reports:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-reports
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref ConnectorCpu
      Memory: !Ref ConnectorMemory
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ConnectorTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-reports-data}
        - Name: bundles
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bundles}
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/reports:${ReportsTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          MountPoints:
            - {SourceVolume: data, ContainerPath: /workspace/Reports-Connector/data}
            - {SourceVolume: bundles, ContainerPath: /bundles}
          Secrets:   # jobs.py's CONNECTOR_SETTINGS: one parameter rolls every connector back at once
            - {Name: METAMORPH_PDF_LINES, ValueFrom: /metamorph/connectors/pdf-lines}
            - {Name: METAMORPH_PDF_ENGINE, ValueFrom: /metamorph/connectors/pdf-engine}
            - {Name: METAMORPH_MINERU_URL, ValueFrom: /metamorph/connectors/mineru-url}
            - {Name: METAMORPH_MINERU_API_KEY, ValueFrom: /metamorph/mineru/api-key}
            - {Name: METAMORPH_MINERU_CACHE, ValueFrom: /metamorph/connectors/mineru-cache}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-reports}

  # metamorph-ops: `sh -c <command>` in the platform image (python, boto3, tar), with every connector's data/ at the
  # path its connector sees, and the bundles. It runs as the connector role: EFS, and the ops bucket's backups/ and
  # transfer/. The weekly backup DAG (dags/backup.py) runs it; the deployment guide's Phase 4 unpacks the Mac's data/.
  Ops:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-ops
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref ConnectorCpu
      Memory: !Ref ConnectorMemory
      EphemeralStorage: {SizeInGiB: 40}
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ConnectorTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      Volumes:
        - Name: ojk
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-ojk-data}
        - Name: bpk
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bpk-data}
        - Name: bi-website
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bi-website-data}
        - Name: dsn-fatwa
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-dsn-fatwa-data}
        - Name: ojk-register
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-ojk-register-data}
        - Name: ojk-stats
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-ojk-stats-data}
        - Name: bi-stats
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bi-stats-data}
        - Name: bps-stats
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bps-stats-data}
        - Name: reports
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-reports-data}
        - Name: bundles
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bundles}
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/platform:${PlatformTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          EntryPoint: [sh, -c]
          User: "0"   # tar sets its directories' times; EFS's access points still write every file as uid 1000
          Command: ["df -h /workspace/*/data /bundles"]
          WorkingDirectory: /workspace
          MountPoints:
            - {SourceVolume: ojk, ContainerPath: /workspace/OJK-Source-Connector/data}
            - {SourceVolume: bpk, ContainerPath: /workspace/BPK-Source-Connector/data}
            - {SourceVolume: bi-website, ContainerPath: /workspace/BI-Source-Connector/data}
            - {SourceVolume: dsn-fatwa, ContainerPath: /workspace/DSN-MUI-Source-Connector/data}
            - {SourceVolume: ojk-register, ContainerPath: /workspace/OJK-Register-Connector/data}
            - {SourceVolume: ojk-stats, ContainerPath: /workspace/OJK-Stats-Connector/data}
            - {SourceVolume: bi-stats, ContainerPath: /workspace/BI-Stats-Connector/data}
            - {SourceVolume: bps-stats, ContainerPath: /workspace/BPS-Stats-Connector/data}
            - {SourceVolume: reports, ContainerPath: /workspace/Reports-Connector/data}
            - {SourceVolume: bundles, ContainerPath: /bundles}
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets: [{Name: OPS_BUCKET, ValueFrom: /metamorph/ops/bucket}]   # dags/backup.py's backup_command uploads to it
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-ops}
