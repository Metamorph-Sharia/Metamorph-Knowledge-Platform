  BiStats:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-bi-stats
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref ConnectorCpu
      Memory: !Ref ConnectorMemory
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ConnectorTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bi-stats-data}
        - Name: bundles
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bundles}
      ContainerDefinitions:
        # Curators drop the month's SEKI zip into s3://<ops bucket>/inbox/bi-seki/ (bi.go.id refuses the connector).
        # This container copies it into the connector's data/inbox/, which `bi-stats import` reads, then main starts.
        - Name: inbox
          Image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          Essential: false
          EntryPoint: [sh, -c]
          Command: ['aws s3 sync "s3://$OPS_BUCKET/inbox/bi-seki/" /workspace/BI-Stats-Connector/data/inbox && ls -l /workspace/BI-Stats-Connector/data/inbox']
          MountPoints: [{SourceVolume: data, ContainerPath: /workspace/BI-Stats-Connector/data}]
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets: [{Name: OPS_BUCKET, ValueFrom: /metamorph/ops/bucket}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-bi-stats}
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/bi-stats:${BiStatsTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          DependsOn: [{ContainerName: inbox, Condition: SUCCESS}]
          MountPoints:
            - {SourceVolume: data, ContainerPath: /workspace/BI-Stats-Connector/data}
            - {SourceVolume: bundles, ContainerPath: /bundles}
          Secrets:   # jobs.py's CONNECTOR_SETTINGS: one parameter rolls every connector back at once
            - {Name: METAMORPH_PDF_LINES, ValueFrom: /metamorph/connectors/pdf-lines}
            - {Name: METAMORPH_PDF_ENGINE, ValueFrom: /metamorph/connectors/pdf-engine}
            - {Name: METAMORPH_MINERU_URL, ValueFrom: /metamorph/connectors/mineru-url}
            - {Name: METAMORPH_MINERU_API_KEY, ValueFrom: /metamorph/mineru/api-key}
            - {Name: METAMORPH_MINERU_CACHE, ValueFrom: /metamorph/connectors/mineru-cache}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-bi-stats}

  BpsStats:
