AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The task Airflow runs on Fargate for processing (deploy/aws/ingestion/README.md): the platform image, in the family
  dags/metamorph_pipeline/jobs.py's task_family() names, with one container, "main". Airflow passes only the command:
  the definition holds its settings (Parameter Store). The platform task loads the bundles the collection host
  uploaded (it reads them from the blobs bucket), builds and publishes the registry, and runs health. Collection runs on
  the collection host, so no connector has a task here (docs/adr/0001-collection-on-a-residential-host.md). Retrieval's
  refresh is the retrieval stack's (family metamorph-retrieval). It creates no IAM resource (the account allows none):
  the task role is DevOps's, by name, as a parameter. Every resource carries Owner=project3.

Parameters:
  PlatformTaskRole:
    Type: String
    Default: metamorph-platform-task
    Description: The role the platform task runs as (the database, the blob bucket)
  PlatformTag: {Type: String, Description: The metamorph/platform image's tag (deploy/aws/push-images.sh)}
  PlatformCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["1024", "2048"]
    Description: The platform task's vCPU units
  PlatformMemory:
    Type: String
    Default: "4096"
    AllowedValues: ["2048", "3072", "4096", "5120", "6144", "7168", "8192"]
    Description: The platform task's memory, MiB

Resources:
  Platform:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-platform
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref PlatformCpu
      Memory: !Ref PlatformMemory
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${PlatformTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/platform:${PlatformTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets:
            - {Name: METAMORPH_DATABASE_URL, ValueFrom: /metamorph/platform/database-url}
            - {Name: METAMORPH_S3_BUCKET, ValueFrom: /metamorph/platform/s3-bucket}   # the blobs bucket, where `load-pending` reads bundles/
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-platform}
