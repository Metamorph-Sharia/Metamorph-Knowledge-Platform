AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The tasks Airflow runs on Fargate (deploy/aws/ingestion/README.md): one task definition for every image a DAG
  runs, named as dags/metamorph_pipeline/jobs.py's task_family() names them: the nine connectors, the platform and
  metamorph-ops. Each has one container, "main". Airflow passes only the command: a definition holds its volumes
  (EFS) and its settings (Parameter Store). A connector mounts its own access point and the bundles, the platform
  only the bundles (read-only). Retrieval's refresh is the retrieval stack's (family metamorph-retrieval). It
  creates no IAM resource (the account allows none): the task roles are DevOps's, by name, as parameters. Every
  resource carries Owner=project3.

Parameters:
  ConnectorTaskRole:
    Type: String
    Default: metamorph-connector-task
    Description: The role the connectors and the ops task run as (EFS, the ops bucket's inbox, transfer/ and backups/)
  PlatformTaskRole:
    Type: String
    Default: metamorph-platform-task
    Description: The role the platform task runs as (the database, the blob bucket)
  PlatformTag: {Type: String, Description: The metamorph/platform image's tag (deploy/aws/push-images.sh)}
  OjkTag: {Type: String, Description: The metamorph/ojk-connector image's tag}
  BpkTag: {Type: String, Description: The metamorph/bpk-connector image's tag}
  BiTag: {Type: String, Description: The metamorph/bi-connector image's tag}
  DsnTag: {Type: String, Description: The metamorph/dsn-mui-connector image's tag}
  OjkRegisterTag: {Type: String, Description: The metamorph/ojk-register image's tag}
  OjkStatsTag: {Type: String, Description: The metamorph/ojk-stats image's tag}
  BiStatsTag: {Type: String, Description: The metamorph/bi-stats image's tag}
  BpsStatsTag: {Type: String, Description: The metamorph/bps-stats image's tag}
  ReportsTag: {Type: String, Description: The metamorph/reports image's tag}
  ConnectorCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
    Description: A connector's vCPU units (the account allows at most 2048). A task is billed only while it runs
  ConnectorMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192"]
    Description: A connector's memory, MiB (the account allows at most 8192)
  PlatformCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["1024", "2048"]
    Description: The platform task's vCPU units
  PlatformMemory:
    Type: String
    Default: "4096"
    AllowedValues: ["2048", "3072", "4096", "5120", "6144", "7168", "8192"]
    Description: The platform task's memory, MiB

Resources:
  Platform:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-platform
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: !Ref PlatformCpu
      Memory: !Ref PlatformMemory
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${PlatformTaskRole}"
      Tags: [{Key: Owner, Value: project3}]
      Volumes:
        - Name: bundles
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue metamorph-efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !ImportValue metamorph-efs-bundles}
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/platform:${PlatformTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          MountPoints: [{SourceVolume: bundles, ContainerPath: /bundles, ReadOnly: true}]   # it reads bundles, never writes
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets:
            - {Name: METAMORPH_DATABASE_URL, ValueFrom: /metamorph/platform/database-url}
            - {Name: METAMORPH_S3_BUCKET, ValueFrom: /metamorph/platform/s3-bucket}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-platform}

  Ojk:
