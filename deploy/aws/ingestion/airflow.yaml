AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Airflow on Fargate (docs/aws-deployment-guide.md): the scheduler and its web UI in one task (`standalone`), its
  metadata in RDS. It starts every DAG task as an ECS task (METAMORPH_TASK_LAUNCHER=ecs; jobs.yaml defines them),
  under a role DevOps made (AirflowTaskRole): this stack creates no IAM. The UI is reached through CloudFront, the
  way dev/retrieval.yaml reaches the gateway: a CloudFront Function asks for HTTP Basic auth at the edge, then a
  VPC origin reaches an internal load balancer in front of the webserver; Airflow's own sign-in comes after. The
  password lives in Parameter Store (/metamorph/airflow/admin-password); only its SHA-256 is here. Stop Airflow
  with DesiredCount=0: no task then runs. Every resource carries Owner=project3.

Parameters:
  AirflowTag: {Type: String, Description: The metamorph/airflow image's tag (deploy/aws/push-images.sh)}
  AirflowTaskRole:
    Type: String
    Default: metamorph-airflow-task
    Description: The role DevOps made for Airflow's DAGs (runs Metamorph's task definitions, reads their logs)
  PasswordSha256:
    Type: String
    NoEcho: true
    AllowedPattern: "[0-9a-f]{64}"
    Description: 'The SHA-256, in hex, of the password the edge asks for (any user name): printf %s "$PASSWORD" | shasum -a 256'
  WebAclArn:
    Type: String
    Default: ""
    Description: The rate-limiting web ACL that ingestion/waf.sh makes in us-east-1 (CloudFront's region), or empty
  CloudFrontPrefixList:
    Type: String
    Default: pl-bca247d5
    Description: CloudFront's origin-facing addresses in this region, the only source the load balancer accepts
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
  AlertWebhook:
    Type: String
    Default: "no"
    AllowedValues: ["yes", "no"]
    Description: '"yes" once /metamorph/airflow/alert-webhook-url exists: failed tasks are posted there'

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]
  HasAlertWebhook: !Equals [!Ref AlertWebhook, "yes"]

Resources:
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-airflow
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      # Scheduler, web server and one process per running task share it. At 0.5 vCPU / 3 GB three tasks at once reached
      # 95 % memory and the health check failed (2026-11-23).
      Cpu: "1024"
      Memory: "6144"
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${AirflowTaskRole}
      Tags: [{Key: Owner, Value: project3}]
      ContainerDefinitions:
        - Name: main
          Image: !Sub
            - "${Registry}/metamorph/airflow:${AirflowTag}"
            - Registry: !ImportValue metamorph-registry
          Essential: true
          Command: [standalone]
          PortMappings: [{ContainerPort: 8080}]
          Environment:
            - {Name: AIRFLOW__CORE__EXECUTOR, Value: LocalExecutor}
            - {Name: AIRFLOW__CORE__LOAD_EXAMPLES, Value: "false"}
            - {Name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG, Value: "false"}
            - {Name: AIRFLOW__WEBSERVER__WORKERS, Value: "2"}   # one person uses the UI; each worker holds ~250 MB
            # Behind CloudFront and a load balancer: links and redirects use CloudFront's address and https
            - {Name: AIRFLOW__WEBSERVER__BASE_URL, Value: !Sub "https://${Distribution.DomainName}"}
            # The host comes from X-Forwarded-Host, which the CloudFront function sets (PasswordCheck below): Host is
            # the load balancer's own name. The load balancer rewrites X-Forwarded-Proto to http and -Port to 80, so
            # ProxyFix must not read them. No scheme header is added: gunicorn answers 400 when its scheme headers
            # contradict the load balancer's http (seen live, 2026-11-23). Absolute links (a sign-in's next=) say
            # http instead, and CloudFront sends those back to https (ViewerProtocolPolicy below).
            - {Name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX, Value: "true"}
            - {Name: AIRFLOW__WEBSERVER__PROXY_FIX_X_HOST, Value: "1"}
            - {Name: AIRFLOW__WEBSERVER__PROXY_FIX_X_PROTO, Value: "0"}
            - {Name: AIRFLOW__WEBSERVER__PROXY_FIX_X_PORT, Value: "0"}
            # The image's entrypoint migrates the database and makes the admin account, with the password in
            # Parameter Store, before `standalone` starts: a new task keeps the same sign-in.
            - {Name: _AIRFLOW_DB_MIGRATE, Value: "true"}
            - {Name: _AIRFLOW_WWW_USER_CREATE, Value: "true"}
            - {Name: _AIRFLOW_WWW_USER_USERNAME, Value: admin}
            - {Name: METAMORPH_TASK_LAUNCHER, Value: ecs}
            - {Name: METAMORPH_SIDE, Value: processing}   # this Airflow builds only the processing DAGs (ADR 0001)
            - {Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}
          Secrets:
            - {Name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN, ValueFrom: /metamorph/airflow/database-url}
            - {Name: AIRFLOW__WEBSERVER__SECRET_KEY, ValueFrom: /metamorph/airflow/webserver-secret}
            - {Name: _AIRFLOW_WWW_USER_PASSWORD, ValueFrom: /metamorph/airflow/admin-password}
            - {Name: METAMORPH_ECS_CLUSTER, ValueFrom: /metamorph/airflow/ecs-cluster}
            - {Name: METAMORPH_ECS_SUBNETS, ValueFrom: /metamorph/airflow/ecs-subnets}
            - {Name: METAMORPH_ECS_SECURITY_GROUP, ValueFrom: /metamorph/airflow/ecs-security-group}
            - {Name: METAMORPH_ECS_LOG_GROUP, ValueFrom: /metamorph/airflow/ecs-log-group}
            - {Name: METAMORPH_BUNDLES_BUCKET, ValueFrom: /metamorph/platform/s3-bucket}   # load_bundles loads s3://<it>/bundles/<connector>: the blobs bucket, which the platform task already reads
            - !If
              - HasAlertWebhook
              - {Name: METAMORPH_ALERT_WEBHOOK_URL, ValueFrom: /metamorph/airflow/alert-webhook-url}
              - !Ref AWS::NoValue
          HealthCheck:
            Command: [CMD-SHELL, curl --fail --silent http://localhost:8080/health]
            Interval: 30
            Retries: 5
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-airflow}

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: airflow
      Cluster: !ImportValue metamorph-cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 300   # `standalone` migrates the database before the webserver answers
      DeploymentConfiguration:             # never two schedulers: the old task stops before the new one starts
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      LoadBalancers: [{ContainerName: main, ContainerPort: 8080, TargetGroupArn: !Ref Target}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split [",", !ImportValue metamorph-subnets]
          SecurityGroups: [!ImportValue metamorph-sg-airflow]
          AssignPublicIp: ENABLED
      Tags: [{Key: Owner, Value: project3}]

  # The way in: CloudFront (HTTPS, its own *.cloudfront.net name) -> VPC origin -> internal load balancer -> Airflow.
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: metamorph Airflow UI load balancer, from CloudFront only
      VpcId: !ImportValue metamorph-vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList}
      Tags: [{Key: Owner, Value: project3}]
  AirflowFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue metamorph-sg-airflow
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LoadBalancerGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: metamorph-airflow
      Type: application
      Scheme: internal
      Subnets: !Split [",", !ImportValue metamorph-private-subnets]
      SecurityGroups: [!Ref LoadBalancerGroup]
      Tags: [{Key: Owner, Value: project3}]
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !ImportValue metamorph-vpc
      HealthCheckPath: /health
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
      Tags: [{Key: Owner, Value: project3}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Target}]

  Origin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: metamorph-airflow
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
      Tags: [{Key: Owner, Value: project3}]

  # The password check, before anything reaches AWS's network. A request without the password gets 401 and a
  # Basic challenge at the edge; with it, the header is dropped, so the password goes no further than CloudFront.
  # The user name is ignored: the password is the credential. Airflow's own sign-in follows.
  PasswordCheck:
    Type: AWS::CloudFront::Function
    Properties:
      Name: metamorph-airflow-password
      AutoPublish: true
      FunctionConfig: {Comment: metamorph Airflow UI password, Runtime: cloudfront-js-2.0}
      FunctionCode: !Sub |
        const crypto = require('crypto');
        const PASSWORD_SHA256 = '${PasswordSha256}';
        const BASIC = /^basic\s+(\S+)$/i;

        function handler(event) {
            const request = event.request;
            const header = request.headers.authorization;
            const presented = header ? BASIC.exec(header.value) : null;
            if (presented) {
                const credentials = Buffer.from(presented[1], 'base64').toString('utf8');
                const password = credentials.slice(credentials.indexOf(':') + 1);
                if (crypto.createHash('sha256').update(password).digest('hex') === PASSWORD_SHA256) {
                    delete request.headers.authorization;
                    // The host the viewer used. The origin sees Host = the load balancer's name, so Airflow would
                    // build links and redirects to the internal load balancer. Set here, never taken from the viewer:
                    // Airflow reads it through ProxyFix (see the container's environment).
                    request.headers['x-forwarded-host'] = {value: request.headers.host.value};
                    return request;
                }
            }
            return {
                statusCode: 401,
                statusDescription: 'Unauthorized',
                headers: {'www-authenticate': {value: 'Basic realm="metamorph airflow"'}},
            };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: metamorph Airflow UI
        HttpVersion: http2and3
        PriceClass: PriceClass_200          # includes Asia
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: airflow
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig: {VpcOriginId: !GetAtt Origin.Id, OriginReadTimeout: 60}
        # The UI is a session and live state: nothing is cached, and every cookie and header reaches Airflow.
        DefaultCacheBehavior:
          TargetOriginId: airflow
          ViewerProtocolPolicy: redirect-to-https   # Airflow's absolute links say http (see its environment)
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt PasswordCheck.FunctionARN}]
      Tags: [{Key: Owner, Value: project3}]

Outputs:
  Url:
    Description: Airflow's UI. The password at the edge, then Airflow's own sign-in (admin)
    Value: !Sub "https://${Distribution.DomainName}"
