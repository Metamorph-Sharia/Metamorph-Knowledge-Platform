AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ingestion alerts, by email: a failed Metamorph task (EventBridge, ECS Task State Change; a task that ECS stops itself in a service deploy is no failure) and a dead Airflow
  (a CloudWatch alarm). No IAM resources: the topic policy lets EventBridge publish, and CloudWatch alarms publish
  to topics of their own account without one. Independent of the other ingestion stacks; needs only the core.
  After deploying, confirm the subscription from the email SNS sends.

Parameters:
  AlertEmail: {Type: String, AllowedPattern: '[^@\s]+@[^@\s]+', Description: Where the alerts go}

Resources:
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: metamorph-ingestion-alerts
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
      Tags: [{Key: Owner, Value: project3}]

  TopicPolicy:   # EventBridge is no principal of the topic's account: the rule needs this to publish
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Topic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgePublishes
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref Topic
            Condition:   # only this stack's rule, not any rule in the account
              ArnEquals: {"aws:SourceArn": !GetAtt Rule.Arn}

  Rule:   # a task of ours ended with a failing container: any non-zero exit code, OOM kills (137) included
    Type: AWS::Events::Rule
    Properties:
      Name: metamorph-task-failed
      Description: A Metamorph ECS task stopped with a non-zero exit code
      State: ENABLED
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!ImportValue metamorph-cluster-arn]
          lastStatus: [STOPPED]
          stopCode: [EssentialContainerExited]   # the container ended on its own; not ServiceSchedulerInitiated, which is ECS replacing a service's task in a deploy (exit 137 or 143)
          # The ingestion families by name (jobs.yaml's and airflow.yaml's), not every `metamorph-` task: the MinerU
          # task (metamorph-mineru, mineru.yaml) is killed every night when its instance stops. The trailing colon
          # keeps one name from matching another that starts with it. A new family is added here (a test checks).
          taskDefinitionArn:
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-airflow:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-platform:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-ops:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-ojk-connector:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-bpk-connector:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-bi-connector:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-dsn-mui-connector:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-ojk-register:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-ojk-stats:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-bi-stats:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-bps-stats:"
            - prefix: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/metamorph-reports:"
          containers:
            exitCode: [{anything-but: [0]}]
      Targets: [{Id: email, Arn: !Ref Topic}]
      Tags: [{Key: Owner, Value: project3}]

  Alarm:
    # The ECS service metrics of AWS/ECS (CPUUtilization, MemoryUtilization) exist without Container Insights, but
    # only while the service has running tasks. SampleCount of CPUUtilization over five minutes is then at least 1,
    # and a service with no task publishes nothing: missing data counts as breaching. Two periods are ten minutes.
    # (RunningTaskCount needs Container Insights, which costs per metric.) A deliberate DesiredCount=0 alarms too.
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: metamorph-airflow-down
      AlarmDescription: The airflow service has had no running task for 10 minutes
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: ClusterName, Value: metamorph}
        - {Name: ServiceName, Value: airflow}
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Topic]
      Tags: [{Key: Owner, Value: project3}]

Outputs:
  TopicArn: {Value: !Ref Topic}
