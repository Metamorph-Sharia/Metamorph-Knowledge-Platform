AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Metamorph's PostgreSQL 16 (docs/aws-deployment-plan.md): the platform's database and BI's own, and later
  Airflow's, on RDS for PostgreSQL (Instance). It replaced Aurora Serverless v2 on 2026-10-30; Aurora's final
  snapshot is kept. 14 days of point-in-time recovery. The master password
  is read from Parameter Store (/metamorph/database/master-password), never written in the template. Also
  metamorph-dbops: psql, pg_dump and pg_restore in the VPC, between the database and the operations bucket, without a
  tunnel. /metamorph/database/host names RDS.

Parameters:
  EngineVersion:
    Type: String
    Default: "16.15"
    Description: >-
      PostgreSQL 16's minor version. The newest in the region:
      aws rds describe-db-engine-versions --engine postgres --engine-version 16 --query 'DBEngineVersions[-1].EngineVersion'
  InstanceClass:
    Type: String
    Default: db.t4g.medium
    AllowedValues: [db.t4g.medium, db.t4g.large, db.m7g.large]
    Description: >-
      RDS's size: 2 vCPU and 4 GiB. Next steps up: db.t4g.large (8 GiB) if FreeableMemory stays under 500 MB,
      db.m7g.large if nightly builds use up the CPU credits
  Storage:
    Type: Number
    Default: 50
    Description: GB of gp3 to start with; it grows by itself up to MaxStorage
  MaxStorage:
    Type: Number
    Default: 200

Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: metamorph database
      SubnetIds: !Split [",", !ImportValue metamorph-subnets]

  # RDS for PostgreSQL: a fixed size, always on. Aurora's pause saves nothing once Airflow and the retrieval gateway
  # hold connections, and its 15-second wake outlasts the gateway's 10-second timeout (docs/aws-deployment-plan.md §4.1).
  Settings:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: metamorph PostgreSQL 16
      Parameters:
        log_min_duration_statement: "1000"   # log any statement over a second
        rds.force_ssl: "1"
  Instance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: metamorph-pg
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: !Ref Storage
      MaxAllocatedStorage: !Ref MaxStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: metamorph
      MasterUsername: metamorph
      MasterUserPassword: "{{resolve:ssm-secure:/metamorph/database/master-password}}"
      Port: "5432"
      DBParameterGroupName: !Ref Settings
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups: [!ImportValue metamorph-sg-database]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 14
      PreferredBackupWindow: "19:00-19:30"           # 02:00 WIB
      PreferredMaintenanceWindow: "sun:20:00-sun:20:30"
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true

  HostSetting:   # the database URLs in Parameter Store are built from it
    Type: AWS::SSM::Parameter
    Properties: {Name: /metamorph/database/host, Type: String, Value: !GetAtt Instance.Endpoint.Address}

  # metamorph-dbops: "fetch" copies s3://<ops bucket>/transfer/database/ into /work, "main" runs its command with
  # psql, pg_dump and pg_restore, signed in as the master user, then "put" copies /work/out/ to s3://<ops bucket>/exports/.
  # The guide passes a restore (Phase 4) or a dump (Sharing a copy) as main's command.
  Operations:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: metamorph-dbops
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: "1024"
      Memory: "2048"
      EphemeralStorage: {SizeInGiB: 30}
      ExecutionRoleArn: !ImportValue metamorph-execution-role
      TaskRoleArn: !ImportValue metamorph-app-role   # the operations bucket, through its policy
      Volumes: [{Name: work}]
      ContainerDefinitions:
        - Name: fetch
          Image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          Essential: false
          EntryPoint: [sh, -c]
          Command: ['aws s3 cp --recursive "s3://$OPS_BUCKET/transfer/database/" /work/ && ls -l /work']
          MountPoints: [{SourceVolume: work, ContainerPath: /work}]
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets: [{Name: OPS_BUCKET, ValueFrom: /metamorph/ops/bucket}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-dbops}
        - Name: main
          Image: public.ecr.aws/docker/library/postgres:16
          Essential: false                 # "put" ends the task, after main succeeds
          DependsOn: [{ContainerName: fetch, Condition: SUCCESS}]
          EntryPoint: [sh, -c]
          Command: ["psql -Atc 'select version()'"]
          WorkingDirectory: /work
          MountPoints: [{SourceVolume: work, ContainerPath: /work}]
          Environment:
            - {Name: PGUSER, Value: metamorph}
            - {Name: PGDATABASE, Value: metamorph}
          Secrets:
            - {Name: PGHOST, ValueFrom: /metamorph/database/host}
            - {Name: PGPASSWORD, ValueFrom: /metamorph/database/master-password}
            - {Name: BI_PASSWORD, ValueFrom: /metamorph/database/bi-password}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-dbops}
        - Name: put
          Image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          Essential: true
          DependsOn: [{ContainerName: main, Condition: SUCCESS}]
          EntryPoint: [sh, -c]
          Command: ['mkdir -p /work/out && aws s3 cp --recursive /work/out/ "s3://$OPS_BUCKET/exports/"']
          MountPoints: [{SourceVolume: work, ContainerPath: /work}]
          Environment: [{Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}]
          Secrets: [{Name: OPS_BUCKET, ValueFrom: /metamorph/ops/bucket}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: /metamorph, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: metamorph-dbops}

Outputs:
  Host: {Value: !GetAtt Instance.Endpoint.Address, Export: {Name: metamorph-database-host}}
