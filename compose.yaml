# Local stack for the Data/Source Management layer: `docker compose up -d`.
# Dev-only defaults below; override any of them in a .env file (see .env.example).

name: metamorph

x-database-url: &database-url postgresql://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph-dev}@postgres:5432/metamorph

services:
  postgres:
    image: pgvector/pgvector:pg16          # pgvector is installed for the Knowledge and Retrieval layer; unused here
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metamorph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metamorph-dev}
      POSTGRES_DB: metamorph
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d metamorph"]
      interval: 5s
      retries: 20

  objectstore:
    image: chrislusf/seaweedfs:3.97         # S3-compatible; the platform uses only the S3 API
    command: >
      server -dir=/data -ip=objectstore -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["${S3_PORT:-8333}:8333"]
    volumes:
      - objectstore-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://objectstore:9333/cluster/status"]
      interval: 5s
      retries: 20

  migrate:
    build: {context: ., dockerfile: docker/platform.Dockerfile}
    image: metamorph-platform:dev
    command: ["db", "migrate"]
    environment:
      METAMORPH_DATABASE_URL: *database-url
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone                     # scheduler + webserver; admin password in standalone_admin_password.txt
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph-dev}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 15s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  objectstore-data:
