# Local stack for the Data/Source Management layer: `docker compose up -d`.
# Dev-only defaults below; override any of them in a .env file (see .env.example).

name: metamorph

x-database-url: &database-url postgresql://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph-dev}@postgres:5432/metamorph
# Connector images: built from the workspace root (the directory holding every repository), never run as services;
# Airflow starts them per task. Build them with: docker compose --profile connectors build
x-connector: &connector
  profiles: ["connectors"]
  command: ["true"]

services:
  postgres:
    image: pgvector/pgvector:pg16          # pgvector: the retrieval layer's index (retrieval_market) uses it
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metamorph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metamorph-dev}
      POSTGRES_DB: metamorph
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-bi-dev}  # docker/postgres/init/02-bi.sh: BI's own database
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d metamorph"]
      interval: 5s
      retries: 20

  objectstore:
    image: chrislusf/seaweedfs:3.97         # S3-compatible; the platform uses only the S3 API
    command: >
      server -dir=/data -ip=objectstore -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["${S3_PORT:-8333}:8333"]
    volumes:
      - objectstore-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://objectstore:9333/cluster/status"]
      interval: 5s
      retries: 20

  migrate:
    build: {context: ., dockerfile: docker/platform.Dockerfile}
    image: metamorph-platform:dev
    command: ["db", "migrate"]
    environment:
      METAMORPH_DATABASE_URL: *database-url
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone                     # scheduler + webserver; admin password in standalone_admin_password.txt
    # Every task is a container (dags/metamorph_pipeline/containers.py), started through the host's Docker.
    # Group 0 may use the socket. Local only: on a server, put a socket proxy in front of it.
    user: "50000:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph-dev}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      # What the DAGs hand to their containers (dags/metamorph_pipeline/jobs.py, containers.py).
      METAMORPH_WORKSPACE: ${METAMORPH_WORKSPACE:-}     # host path of the directory holding the connector repositories
      METAMORPH_OJK_CREDENTIALS: ${METAMORPH_OJK_CREDENTIALS:-${HOME}/.config/ojk-connector/credentials}
      METAMORPH_DATABASE_URL: *database-url
      METAMORPH_S3_ENDPOINT_URL: http://objectstore:8333
      METAMORPH_S3_BUCKET: ${METAMORPH_S3_BUCKET:-metamorph-blobs}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-metamorph}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-metamorph-dev-secret}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DATABASE_URL: postgresql+psycopg://bi:${BI_DB_PASSWORD:-bi-dev}@postgres:5432/bi   # BI connector's own store
      METAMORPH_ALERT_WEBHOOK_URL: ${METAMORPH_ALERT_WEBHOOK_URL:-}
      METAMORPH_PDF_LINES: ${METAMORPH_PDF_LINES:-printed}   # connectors' PDF text: printed lines; "extracted" rolls back
      METAMORPH_PDF_ENGINE: ${METAMORPH_PDF_ENGINE:-pymupdf}   # "mineru": MinerU reads connectors' PDFs; "pymupdf" rolls back
      METAMORPH_MINERU_URL: ${METAMORPH_MINERU_URL:-http://host.docker.internal:8010}   # the MinerU service
      METAMORPH_MINERU_API_KEY: ${METAMORPH_MINERU_API_KEY:-}
      METAMORPH_MINERU_CACHE: ${METAMORPH_MINERU_CACHE:-data/mineru-cache}   # in each connector's mounted data/
      OJK_REGISTER_CONTACT: ${OJK_REGISTER_CONTACT:-}   # optional: OJK-Register-Connector's User-Agent contact
      OJK_STATS_CONTACT: ${OJK_STATS_CONTACT:-}         # optional: OJK-Stats-Connector's User-Agent contact
      BPS_STATS_CONTACT: ${BPS_STATS_CONTACT:-}         # optional: BPS-Stats-Connector's User-Agent contact
      REPORTS_CONTACT: ${REPORTS_CONTACT:-}             # optional: Reports-Connector's User-Agent contact
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 15s
      retries: 20
      start_period: 60s

  web:                                      # the curation app (Metamorph-Curation-Web): http://localhost:8000
    build: {context: ../Metamorph-Curation-Web}   # its own repository, beside this one
    image: metamorph/curation-web:dev
    environment:
      METAMORPH_API_URL: http://api:8001        # the API on the compose network; browsers never call it
    ports: ["${WEB_PORT:-8000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/sign-in').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 15s
      retries: 5

  api:                                      # the curation JSON API, which the curation app calls: http://localhost:8001/api/v1
    image: metamorph-platform:dev
    command: ["api", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      METAMORPH_DATABASE_URL: *database-url
      METAMORPH_S3_ENDPOINT_URL: http://objectstore:8333
      METAMORPH_S3_PUBLIC_ENDPOINT_URL: http://localhost:${S3_PORT:-8333}   # file links are opened by browsers
      METAMORPH_S3_BUCKET: ${METAMORPH_S3_BUCKET:-metamorph-blobs}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-metamorph}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-metamorph-dev-secret}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      METAMORPH_CURATORS: ${METAMORPH_CURATORS:-}    # the same accounts as the HTML app; unset: it refuses to start
      METAMORPH_WEB_SECRET: ${METAMORPH_WEB_SECRET:-}  # signs the session tokens
    ports: ["${API_PORT:-8001}:8001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      objectstore: {condition: service_healthy}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 15s
      retries: 5

  # Production only, on Linux with an NVIDIA GPU: `docker compose --profile mineru up -d mineru`, and the connectors
  # are given METAMORPH_MINERU_URL=http://mineru:8010. On a Mac MinerU runs natively (README: Running MinerU).
  mineru:
    profiles: ["mineru"]
    build: {context: docker/mineru}
    image: metamorph/mineru:4.0.12
    environment:
      MINERU_API_KEY: ${METAMORPH_MINERU_API_KEY:-}
    ports: ["127.0.0.1:8010:8010"]          # the server's loopback only: for an SSM tunnel and mineru_check
    volumes:
      - mineru-uploads:/uploads
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped
    healthcheck:                            # ok once the models are loaded (--preload-models)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/health')"]
      interval: 30s
      retries: 5
      start_period: 300s

  ojk-connector:
    <<: *connector
    build: {context: .., dockerfile: OJK-Source-Connector/Dockerfile}
    image: metamorph/ojk-connector:dev
  bpk-connector:
    <<: *connector
    build: {context: .., dockerfile: BPK-Source-Connector/Dockerfile}
    image: metamorph/bpk-connector:dev
  dsn-mui-connector:
    <<: *connector
    build: {context: .., dockerfile: DSN-MUI-Source-Connector/Dockerfile}
    image: metamorph/dsn-mui-connector:dev
  bi-connector:
    <<: *connector
    build: {context: .., dockerfile: BI-Source-Connector/Dockerfile}
    image: metamorph/bi-connector:dev
  ojk-register:
    <<: *connector
    build: {context: .., dockerfile: OJK-Register-Connector/Dockerfile}
    image: metamorph/ojk-register:dev
  ojk-stats:
    <<: *connector
    build: {context: .., dockerfile: OJK-Stats-Connector/Dockerfile}
    image: metamorph/ojk-stats:dev
  bi-stats:
    <<: *connector
    build: {context: .., dockerfile: BI-Stats-Connector/Dockerfile}
    image: metamorph/bi-stats:dev
  bps-stats:
    <<: *connector
    build: {context: .., dockerfile: BPS-Stats-Connector/Dockerfile}
    image: metamorph/bps-stats:dev
  reports:
    <<: *connector
    build: {context: .., dockerfile: Reports-Connector/Dockerfile}
    image: metamorph/reports:dev
  retrieval:                                # the retrieval layer (../Metamorph-Retrieval): built here for market_index
    <<: *connector
    build: {context: ../Metamorph-Retrieval}
    image: metamorph/retrieval:dev

networks:
  default:
    name: metamorph                         # task containers join it by this name

volumes:
  postgres-data:
  objectstore-data:
  metamorph-models:                         # the retrieval image's embedding models, kept between runs
    name: metamorph-models
  bundles:
    name: metamorph-bundles                 # connectors write bundles here; `metamorph load` reads them
  mineru-uploads:                           # the files MinerU was sent, kept a day (its --retention-seconds)
