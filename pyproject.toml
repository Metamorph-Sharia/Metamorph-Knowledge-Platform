[project]
name = "metamorph-knowledge-platform"
version = "0.1.0"
description = "Data/Source Management layer: contract, loader, resolver and registry for Metamorph's legal knowledge base"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.114",
    "fastapi>=0.115",
    "metamorph-contract",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.scripts]
metamorph = "metamorph_platform.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "metamorph-pdf-text",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_platform"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
metamorph-contract = { workspace = true }
metamorph-pdf-text = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/metamorph-contract/tests", "packages/metamorph-pdf-text/tests", "tests", "dags"]
markers = [
    "database: needs a PostgreSQL server (METAMORPH_TEST_DATABASE_URL); skipped otherwise",
    "mineru: needs a MinerU service (METAMORPH_TEST_MINERU_URL); skipped otherwise",
    "s3: needs an S3-compatible store (METAMORPH_TEST_S3_ENDPOINT_URL + AWS_* credentials); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLE"]
