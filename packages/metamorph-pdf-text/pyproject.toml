[project]
name = "metamorph-pdf-text"
version = "0.1.0"
description = "An official file's pages read into clean, laid-out text for a Metamorph connector: page furniture removed, structure kept on its own lines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",  # the MinerU service's V1 API
    "metamorph-contract",  # printed_text, for the text layer
    "pymupdf>=1.24",  # the text layer
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_pdf_text"]
